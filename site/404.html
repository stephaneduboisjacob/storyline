<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — StoryLine</title>
<link rel="icon" type="image/png" href="/images/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Inter",system-ui,sans-serif;background:#FAF5EC;color:#26301F;
display:grid;place-items:center;min-height:100vh;text-align:center;padding:28px;}
.card{max-width:560px}
img{width:min(420px,88vw);border-radius:26px;box-shadow:0 18px 50px -18px rgba(31,42,28,.35)}
h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(34px,6vw,52px);margin:28px 0 10px}
p{color:#5B6350;font-size:17px;margin:0 0 26px}
a{display:inline-block;background:#1E3A2A;color:#FFFBF3;padding:14px 30px;border-radius:999px;
font-weight:600;text-decoration:none;transition:transform .25s}
a:hover{transform:translateY(-2px);background:#2C523C}
</style>
</head>
<body>
<div class="card">
  <img src="/images/404-tangled.webp" alt="">
  <h1>Le fil s'est emmêlé.</h1>
  <p>Cette page n'existe pas — mais le numéro de Mamie, lui, fonctionne toujours.</p>
  <p hidden id="alt"></p>
  <a href="/">Rappeler la maison</a>
</div>
<script>
var M={fr:["Le fil s'est emmêlé.","Cette page n'existe pas — mais le numéro de Mamie, lui, fonctionne toujours.","Rappeler la maison"],
en:["The line got tangled.","This page doesn't exist — but Grandma's number still works.","Call home"],
es:["La línea se enredó.","Esta página no existe — pero el número de Abuela sigue funcionando.","Llamar a casa"],
it:["Il filo si è ingarbugliato.","Questa pagina non esiste — ma il numero della Nonna funziona ancora.","Chiama casa"],
de:["Die Leitung hat sich verheddert.","Diese Seite existiert nicht — aber Omas Nummer funktioniert noch.","Zu Hause anrufen"],
ru:["Провод запутался.","Этой страницы нет — а вот номер бабушки по-прежнему работает.","Позвонить домой"],
zh:["线路缠住了。","这个页面不存在——但奶奶的电话依然打得通。","打回家"]};
var l=(localStorage.getItem("storyline.lang")||(navigator.language||"fr").split("-")[0]);
if(!M[l])l="fr";document.documentElement.lang=l;
document.querySelector("h1").textContent=M[l][0];document.querySelector("p").textContent=M[l][1];
document.querySelector("a").textContent=M[l][2];
</script>
</body>
</html>
